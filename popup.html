<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open Tab on the Right</title>
    <style>
        :root {
            --primary-color: #0060df;
            --primary-hover: #003eaa;
            --card-bg: #ffffff;
            --text-color: #15141a;
            --text-secondary: #5b5b66;
            --border-color: #ced4da;
            --badge-bg: #f0f0f4;
            --badge-border: #d0d0d7;
            --badge-shadow: rgba(0, 0, 0, 0.06);
            --btn-secondary-bg: #f0f0f4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #45a1ff;
                --primary-hover: #73b7ff;
                --card-bg: #2b2a33;
                --text-color: #f9f9fb;
                --text-secondary: #b1b1b3;
                --border-color: #4a4a4f;
                --badge-bg: #38373f;
                --badge-border: #56555e;
                --badge-shadow: rgba(0, 0, 0, 0.2);
                --btn-secondary-bg: #38373f;
            }
        }

        body {
            width: 300px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .popup-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid var(--badge-border);
        }

        .popup-header img {
            width: 20px;
            height: 20px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 6px;
        }

        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 10px;
            background: none;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            text-align: left;
        }

        .action-row:hover {
            background: var(--btn-secondary-bg);
        }

        .action-label {
            white-space: nowrap;
        }

        /* Per-key chips, same visual family as the options page recorder. */
        .shortcut-keys {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }

        .key-chip {
            min-width: 13px;
            padding: 2px 5px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            color: var(--text-color);
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 4px;
            box-shadow: 0 1px 1px var(--badge-shadow);
            white-space: nowrap;
        }

        .key-sep {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .popup-footer {
            padding: 8px;
            border-top: 1px solid var(--badge-border);
        }

        #open-settings {
            width: 100%;
            padding: 8px;
            background: var(--primary-color);
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            cursor: pointer;
        }

        #open-settings:hover {
            background: var(--primary-hover);
        }

        @media (prefers-color-scheme: dark) {
            #open-settings {
                color: #15141a;
            }
        }
    </style>
</head>
<body>
    <div class="popup-header">
        <img src="icon-48.png" alt="">
        <span>Open Tab on the Right</span>
    </div>

    <div class="actions">
        <button class="action-row" id="action-open-tab-right" type="button">
            <span class="action-label">New tab to the right</span>
            <span class="shortcut-keys" data-command="open-tab-right" hidden></span>
        </button>
        <button class="action-row" id="action-move-tab-prev" type="button">
            <span class="action-label">Move tab left</span>
            <span class="shortcut-keys" data-command="move-tab-prev" hidden></span>
        </button>
        <button class="action-row" id="action-move-tab-next" type="button">
            <span class="action-label">Move tab right</span>
            <span class="shortcut-keys" data-command="move-tab-next" hidden></span>
        </button>
    </div>

    <div class="popup-footer">
        <button id="open-settings" type="button">Settings</button>
    </div>

    <script src="browser-polyfill.js"></script>
    <script src="popup.js"></script>
</body>
</html>
