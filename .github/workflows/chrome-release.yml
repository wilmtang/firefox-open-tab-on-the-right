name: Release & Publish Chrome Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish to Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Chrome end-to-end tests
        run: npm run test:e2e:chrome
        env:
          HEADLESS: '1'

      - name: Package extension
        run: npm run package:chrome

      - name: Upload to Chrome Web Store
        run: npx chrome-webstore-upload-cli upload --source dist/chrome-extension.zip --extension-id "${{ secrets.CHROME_EXTENSION_ID }}"
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish to Chrome Web Store
        run: npx chrome-webstore-upload-cli publish --extension-id "${{ secrets.CHROME_EXTENSION_ID }}"
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
