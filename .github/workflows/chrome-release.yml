name: Release & Publish Chrome Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish to Chrome Web Store
    runs-on: ubuntu-latest
    env:
      # Public extension ID of the live listing:
      # https://chromewebstore.google.com/detail/open-tab-on-the-right/ckhnejcbfnplejlcnagenldapeeaecie
      EXTENSION_ID: ckhnejcbfnplejlcnagenldapeeaecie
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Chrome end-to-end tests
        run: npm run test:e2e:chrome
        env:
          HEADLESS: '1'

      - name: Package extension
        run: npm run package:chrome

      # Pin to CLI v3: v4 depends on chrome-webstore-upload v6, which requires a
      # separate PUBLISHER_ID option. v3 uses the extension-id publishing flow.
      - name: Upload to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3 upload --source dist/chrome-extension.zip --extension-id "$EXTENSION_ID"
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3 publish --extension-id "$EXTENSION_ID"
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
