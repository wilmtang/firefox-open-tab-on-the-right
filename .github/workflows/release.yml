name: Release & Publish Firefox Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: false
        default: 'v2.0'
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Sign & Publish Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-ext
        run: npm install --no-save web-ext

      - name: Lint Extension
        run: npx web-ext lint

      - name: Submit to AMO
        run: |
          set +e
          npx web-ext sign \
            --channel=listed \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --timeout=300000 \
            --amo-metadata=.github/workflows/amo-metadata.json 2>&1 | tee web-ext.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            if grep -qi -E "timeout|too long|pending" web-ext.log; then
              echo "⚠️ Submission failed due to timeout or pending validation on AMO. This is expected if automated validation takes longer than 5 minutes."
              echo "Please check the AMO Developer Hub to verify the status."
              exit 0
            else
              echo "❌ Submission failed with an error."
              exit $EXIT_CODE
            fi
          fi
