name: Release & Publish Firefox Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Sign & Publish Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Firefox end-to-end tests
        run: npm run test:e2e
        env:
          HEADLESS: '1'

      - name: Lint Extension
        run: npx web-ext lint

      - name: Submit to AMO
        run: |
          set +e
          npx web-ext sign \
            --channel=listed \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --timeout=300000 \
            --amo-metadata=.github/workflows/amo-metadata.json 2>&1 | tee web-ext.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            # Only a genuine client-side timeout is treated as non-fatal: the
            # upload succeeded but AMO validation outran our wait. Any other
            # failure (including rejected/invalid submissions) must fail the job.
            if grep -qi -E "timeout|timed out|exceeded .* seconds" web-ext.log; then
              echo "⚠️ web-ext timed out waiting for AMO validation (upload likely succeeded)."
              echo "Verify the status on the AMO Developer Hub."
              exit 0
            else
              echo "❌ Submission failed with an error."
              exit $EXIT_CODE
            fi
          fi
